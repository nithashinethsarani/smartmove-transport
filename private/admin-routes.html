<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Routes | SmartMove Admin</title>
  
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="top">
    <b>🛠️ SmartMove Admin</b>
    <button onclick="logout()">Logout</button>
  </div>
  <div class="wrap">
   <div class="nav">
      <a href="/admin.html" class="on">Dashboard</a>
      <a href="/admin-vehicles.html">Vehicles</a>
      <a href="/admin-drivers.html">Drivers</a>
      <a href="/admin-routes.html">Routes</a>
      <a href="/admin-trips.html">Trips</a>
      <a href="/admin-maintenance.html">Maintenance</a>
      <a href="/admin-tickets.html">Tickets</a>
      <a href="/admin-reports.html">Reports</a>
      <a href="/admin-insights.html">Customer Insights</a>
    </div>

    <div class="panel">
      <h2 id="formTitle">Add Route</h2>
      <div class="row">
        <input id="rstart" placeholder="Start location">
        <input id="rend" placeholder="End location">
        <input id="rdist" type="number" min="1" placeholder="Distance (km)">
      </div>
      <button class="btn btn-main btn-sm" onclick="save()">Save</button>
      <button class="btn btn-sm" style="background:#F3EEFC;color:#3B1E6E" onclick="resetForm()">Clear</button>
      <div class="msg" id="msg"></div>
    </div>

    <div class="panel scroll">
      <table>
        <thead><tr><th>ID</th><th>Route</th><th>Start</th><th>End</th><th>Distance (km)</th><th>Actions</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>

  <script>
    let editId = null, list = [];
    const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

    async function logout() { await fetch('/api/logout', { method: 'POST' }); location = '/'; }

    async function load() {
      list = await (await fetch('/api/admin/routes')).json();
      rows.innerHTML = list.map(r => `<tr>
        <td>${esc(r.ROUTE_ID)}</td><td>${esc(r.ROUTE_NAME)}</td><td>${esc(r.START_LOCATION)}</td>
        <td>${esc(r.END_LOCATION)}</td><td>${esc(r.DISTANCE)}</td>
        <td><button class="act edit" onclick="edit('${esc(r.ROUTE_ID)}')">Edit</button>
            <button class="act del" onclick="del('${esc(r.ROUTE_ID)}')">Delete</button></td></tr>`).join('');
    }

    function resetForm() {
      editId = null; formTitle.textContent = 'Add Route';
      rstart.value = rend.value = rdist.value = '';
    }

    function edit(id) {
      const r = list.find(x => x.ROUTE_ID === id);
      editId = id; formTitle.textContent = 'Edit Route ' + id;
      rstart.value = r.START_LOCATION; rend.value = r.END_LOCATION; rdist.value = r.DISTANCE;
      scrollTo(0, 0);
    }

    async function save() {
      const body = { start: rstart.value.trim(), end: rend.value.trim(), distance: rdist.value };
      const r = await fetch(editId ? '/api/admin/routes/' + editId : '/api/admin/routes', {
        method: editId ? 'PUT' : 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      const d = await r.json();
      msg.className = 'msg' + (d.ok ? ' ok' : '');
      msg.textContent = d.error || d.message;
      if (d.ok) { resetForm(); load(); }
    }

    async function del(id) {
      if (!confirm('Delete route ' + id + '?')) return;
      const d = await (await fetch('/api/admin/routes/' + id, { method: 'DELETE' })).json();
      msg.className = 'msg' + (d.ok ? ' ok' : '');
      msg.textContent = d.error || d.message;
      load();
    }

    load();
  </script>
</body>
</html>
