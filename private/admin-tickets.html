<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tickets | SmartMove Admin</title>
  
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="top">
    <b>🛠️ SmartMove Admin</b>
    <button onclick="logout()">Logout</button>
  </div>
  <div class="wrap">
   <div class="nav">
      <a href="/admin.html" class="on">Dashboard</a>
      <a href="/admin-vehicles.html">Vehicles</a>
      <a href="/admin-drivers.html">Drivers</a>
      <a href="/admin-routes.html">Routes</a>
      <a href="/admin-trips.html">Trips</a>
      <a href="/admin-maintenance.html">Maintenance</a>
      <a href="/admin-tickets.html">Tickets</a>
      <a href="/admin-reports.html">Reports</a>
      <a href="/admin-insights.html">Customer Insights</a>
    </div>


    <div class="panel">
      <h2>Tickets & Payments</h2>
      <div class="row">
        <select id="filter" onchange="render()">
          <option value="">All payments</option>
          <option>Pending</option><option>Paid</option><option>Refunded</option><option>Cancelled</option>
        </select>
      </div>
      <div class="msg" id="msg"></div>
    </div>

    <div class="panel scroll">
      <table>
        <thead><tr><th>Ticket</th><th>Passenger</th><th>Route / Date</th><th>Seat</th><th>Price</th><th>Ticket</th><th>Payment</th><th>Actions</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>

  <script>
    let list = [];
    const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

    async function logout() { await fetch('/api/logout', { method: 'POST' }); location = '/'; }

    async function load() {
      list = await (await fetch('/api/admin/tickets')).json();
      render();
    }

    function render() {
      const f = filter.value;
      rows.innerHTML = list.filter(t => !f || t.PAYMENT_STATUS === f).map(t => {
        let actions = '';
        if (t.TICKET_STATUS !== 'Cancelled') {
          if (t.PAYMENT_STATUS === 'Pending')
            actions += `<select id="m_${esc(t.TICKET_ID)}" style="padding:6px;border-radius:8px"><option>Cash</option><option>Card</option><option>Online</option></select>
                        <button class="act edit" onclick="pay('${esc(t.TICKET_ID)}')">Mark Paid</button>`;
          actions += `<button class="act del" onclick="cancelTicket('${esc(t.TICKET_ID)}')">Cancel</button>`;
        }
        const pay = t.PAYMENT_STATUS ? esc(t.PAYMENT_STATUS) + (t.PAYMENT_STATUS === 'Paid' ? ' · ' + esc(t.PAYMENT_METHOD) : '') : '-';
        return `<tr>
          <td>${esc(t.TICKET_ID)}</td><td>${esc(t.PASSENGER_NAME)}</td>
          <td>${esc(t.ROUTE_NAME)}<br><small>${esc(t.TRIP_ID)} · ${esc(t.TRIP_DATE)}</small></td>
          <td>${esc(t.SEAT_NUMBER)}</td><td>Rs. ${esc(t.TICKET_PRICE)}</td>
          <td><span class="tag">${esc(t.TICKET_STATUS)}</span></td>
          <td><span class="tag">${pay}</span></td><td>${actions}</td></tr>`;
      }).join('');
    }

    async function send(url, body) {
      const r = await fetch(url, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });
      const d = await r.json();
      msg.className = 'msg' + (d.ok ? ' ok' : '');
      msg.textContent = d.error || d.message;
      load();
    }

    function pay(id) { send('/api/admin/tickets/' + id + '/pay', { method: document.getElementById('m_' + id).value }); }
    function cancelTicket(id) { if (confirm('Cancel ticket ' + id + '?')) send('/api/admin/tickets/' + id + '/cancel'); }

    load();
  </script>
</body>
</html>
