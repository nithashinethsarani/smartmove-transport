<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Passenger | SmartMove</title>
  
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="center">
    <div class="card">
      <div class="logo">🧑</div>
      <h2 id="title">Passenger Login</h2>
      <p class="sub" id="sub">Welcome back! Book your next trip</p>
      <div id="regFields" style="display:none">
        <input id="fn" placeholder="First name">
        <input id="ln" placeholder="Last name">
        <input id="ph" placeholder="Phone">
        <input id="ad" placeholder="Address">
      </div>
      <input id="em" type="email" placeholder="Email">
      <input id="pw" type="password" placeholder="Password">
      <button class="btn btn-main" id="go" onclick="submitForm()">Login</button>
      <div class="msg" id="msg"></div>
      <div class="link">
        <span id="sw">New here? <a onclick="toggle()">Create account</a></span> · <a href="index.html">Home</a>
      </div>
    </div>
  </div>
  <script>
    let reg = false;
    function toggle() {
      reg = !reg;
      regFields.style.display = reg ? 'block' : 'none';
      title.textContent = reg ? 'Create Account' : 'Passenger Login';
      sub.textContent = reg ? 'Join SmartMove in a minute' : 'Welcome back! Book your next trip';
      go.textContent = reg ? 'Register' : 'Login';
      sw.innerHTML = reg ? 'Have an account? <a onclick="toggle()">Login</a>'
                         : 'New here? <a onclick="toggle()">Create account</a>';
      msg.textContent = '';
    }
    async function submitForm() {
      const url = reg ? '/api/passenger/register' : '/api/passenger/login';
      const body = reg
        ? { firstName: fn.value, lastName: ln.value, phone: ph.value, address: ad.value, email: em.value, password: pw.value }
        : { email: em.value, password: pw.value };
      const r = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      const d = await r.json();
      if (d.redirect) return location = d.redirect;
      msg.className = 'msg' + (d.ok ? ' ok' : '');
      msg.textContent = d.error || d.message;
      if (d.ok && reg) setTimeout(toggle, 1200);
    }
  </script>
</body>
</html>
